name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extraire le projet depuis le ZIP
        run: unzip -o outil_travail_mobile_v4_atelier.zip

      - name: Corriger la configuration Java/Kotlin
        run: |
          cat > outil_travail_mobile_v3_usb/app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }

          android { namespace = "com.afribdstudio.outiltravailmobile"; compileSdk = 35
           defaultConfig { applicationId = "com.afribdstudio.outiltravailmobile"; minSdk = 23; targetSdk = 35; versionCode = 3; versionName = "3.0-USB-alpha" }
           compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
           kotlinOptions { jvmTarget = "17" }
          }
          EOF

      - name: Installer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer le SDK Android préinstallé
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      - name: Accepter les licences et installer les composants SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Générer le wrapper Gradle
        working-directory: outil_travail_mobile_v3_usb
        run: gradle wrapper --gradle-version 8.9

      - name: Compiler l'APK (debug)
        working-directory: outil_travail_mobile_v3_usb
        run: ./gradlew assembleDebug --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: outil-travail-mobile-apk
          path: outil_travail_mobile_v3_usb/app/build/outputs/apk/debug/*.apk
